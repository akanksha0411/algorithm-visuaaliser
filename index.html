<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Visualizer</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <nav id="nav-container">
        <div class="nav-brand">AlgoShalgo</div>
        <div class="nav-links">
            <div class="nav-item active">Sorting</div>
            <div class="nav-item">Searching</div>
            <div class="nav-item">Graph</div>
            <div class="nav-item">Trees</div>
        </div>
    </nav>

    <main>
        <div id="controls">
            <div class="algo-group">
                <label for="select-algo">Choose Algorithm</label>
                <select name="algos" id="select-algo">
                    <option value="default">Choose</option>
                    <option value="bubble">Bubble Sort</option>
                    <option value="insertion">Insertion Sort</option>
                    <option value="quick">Quick Sort</option>
            </select>
            </div>
            <button id="sort-btn">Sort</button>
            <button id="shuffle-btn">Shuffle</button>
            <div class="slider-group">
                <label for="speed-slider">Speed</label>
                <input type="range" id="speed-slider" min="1" max="100" value="50">
            </div>
        </div>
        <div id="big-container">
            <div id="array-container"></div>
        </div>
    </main>

    <script src="/js/sorting.js" charset="utf-8"></script>
</body>
</html>
